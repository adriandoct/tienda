<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Acceso por Roles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #090d16;
            --bg-card: rgba(19, 29, 51, 0.85);
            --border-subtle: rgba(56, 189, 248, 0.2);
            --border-glow: rgba(56, 189, 248, 0.45);
            --text-title: #f8fafc;
            --text-body: #cbd5e1;
            --text-muted: #94a3b8;
            --accent-cyan: #06b6d4;
            --accent-emerald: #10b981;
            --accent-purple: #a855f7;
            --accent-rose: #f43f5e;
            --grad-primary: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(6, 182, 212, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
            color: var(--text-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 2.5rem;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .badge-system {
            display: inline-block;
            background: rgba(6, 182, 212, 0.12);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 9999px;
            padding: 0.3rem 0.9rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-title);
            margin-bottom: 0.5rem;
        }

        p.sub {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-body);
            margin-bottom: 0.4rem;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
        }

        .btn-submit {
            width: 100%;
            background: var(--grad-primary);
            color: #04121e;
            border: none;
            padding: 0.85rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
        }

        .error-alert {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fda4af;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
        }

        .quick-roles {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .quick-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }

        .quick-btns {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.6rem;
        }

        .btn-quick {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-body);
            padding: 0.55rem 0.5rem;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-quick:hover {
            border-color: var(--accent-cyan);
            background: rgba(30, 41, 59, 1);
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-quick.full-span {
            grid-column: span 2;
        }

        .role-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.85rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <span class="badge-system">Control de Acceso RBAC</span>
            <h1>Iniciar Sesión</h1>
            <p class="sub">Ingresa con cualquiera de los 5 roles del sistema</p>
        </div>

        {% if error_msg %}
            <div class="error-alert">
                ⚠️ {{ error_msg }}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" placeholder="admin, cajero, cmendoza, etc." required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Ingresar al Sistema &rarr;</button>
        </form>

        <div class="quick-roles">
            <div class="quick-title">⚡ Acceso Rápido por Rol (Haz Clic Para Rellenar)</div>
            <div class="quick-btns">
                <button type="button" class="btn-quick" onclick="setCredentials('admin', 'admin1234')">
                    👑 Admin<br><span style="font-size: 0.7rem; color: var(--accent-cyan);">admin1234 (Total)</span>
                </button>
                <button type="button" class="btn-quick" onclick="setCredentials('cajero', 'cajero1234')">
                    💼 Cajero<br><span style="font-size: 0.7rem; color: var(--accent-emerald);">cajero1234 (POS)</span>
                </button>
                <button type="button" class="btn-quick" onclick="setCredentials('cmendoza', 'ingeniero1234')">
                    🔬 Ingeniero<br><span style="font-size: 0.7rem; color: #a78bfa;">ingeniero1234</span>
                </button>
                <button type="button" class="btn-quick" onclick="setCredentials('electromayoreo', 'distribuidor1234')">
                    🏢 Distribuidor<br><span style="font-size: 0.7rem; color: #f59e0b;">distribuidor1234</span>
                </button>
                <button type="button" class="btn-quick full-span" onclick="setCredentials('cliente', 'cliente1234')">
                    👤 Cliente Retail<br><span style="font-size: 0.7rem; color: #38bdf8;">cliente1234 (Catálogo General)</span>
                </button>
            </div>
            <p class="role-desc">
                🔒 Haz clic en cualquiera de los botones para autocompletar usuario y contraseña.
            </p>
        </div>
    </div>

    <script>
        function setCredentials(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
        }
    </script>
</body>
</html>
